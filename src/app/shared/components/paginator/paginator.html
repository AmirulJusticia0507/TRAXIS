<div class="paginator" data-testid="paginator">
  <span class="paginator__info">
    Halaman {{ page() }} dari {{ totalPages() }} &middot; {{ totalItems() }} data
  </span>
  <div class="paginator__controls">
    <button
      type="button"
      class="paginator__button"
      data-testid="page-prev"
      [disabled]="!canPrev()"
      (click)="onPrev()"
    >
      Sebelumnya
    </button>
    <button
      type="button"
      class="paginator__button"
      data-testid="page-next"
      [disabled]="!canNext()"
      (click)="onNext()"
    >
      Berikutnya
    </button>
  </div>
</div>
